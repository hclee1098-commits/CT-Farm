# 서버 전용. LOCAL compose.yaml 및 기존 볼륨 이름을 변경하지 않습니다.
name: ${APP_ID:?고유앱ID_필수}-${DEPLOY_ENV:?staging_또는_production}
x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '3'}
x-security: &security
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging: *logging
services:
  postgres:
    <<: *security
    image: postgres:16-alpine
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?필수}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?필수}
      POSTGRES_DB: ${POSTGRES_DB:?필수}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *security
    image: redis:7-alpine
    networks: [backend]
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *security
    image: ${API_IMAGE:?digest_필수}
    networks: [backend, edge]
    user: '1000:1000'
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?필수}
      DEPLOY_VERSION: ${DEPLOY_VERSION:?필수}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?필수}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?필수}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?필수}
      CORS_ORIGINS: https://${SITE_DOMAIN:?필수}
      TRUST_PROXY_HOPS: 1
      UPLOAD_DIR: ./uploads
      MONITOR_DIR: /monitor
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_PUBLIC_URL: https://${SITE_DOMAIN}
    volumes: [uploads:/app/apps/api/uploads, './.starter-state/monitoring:/monitor']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:4000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s
  web:
    <<: *security
    image: ${WEB_IMAGE:?digest_필수}
    networks: [edge]
    user: '1000:1000'
    environment:
      APP_ENV: ${APP_ENV}
      DEPLOY_VERSION: ${DEPLOY_VERSION}
      MONITOR_DIR: /monitor
    volumes: ['./.starter-state/monitoring:/monitor']
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/monitor-health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
  collector:
    <<: *security
    image: ${COLLECTOR_IMAGE:?digest_필수}
    networks: [backend, edge]
    user: '1000:1000'
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV}
      MONITOR_DIR: /monitor
      MONITOR_API_URL: http://api:4000
      MONITOR_WEB_URL: http://web:3000
      MONITOR_INGEST_URL: ${MONITOR_INGEST_URL:?HTTPS_수집서버_필수}
      MONITOR_WRITE_TOKEN: ${MONITOR_WRITE_TOKEN:?환경별쓰기키_필수}
    volumes: ['./.starter-state/monitoring:/monitor']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, tools/monitoring/check-collector.mjs]
      interval: 20s
      timeout: 5s
      retries: 3
  proxy:
    <<: *security
    image: caddy:2-alpine
    networks: [edge]
    environment: {SITE_DOMAIN: '${SITE_DOMAIN}'}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes: ['./deploy/Caddyfile:/etc/caddy/Caddyfile:ro', caddy_data:/data, caddy_config:/config]
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
  migrate:
    image: ${MIGRATE_IMAGE:?digest_필수}
    networks: [backend]
    profiles: [tools]
    environment: {DATABASE_URL: '${DATABASE_URL}'}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
volumes:
  postgres_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
networks:
  backend: {internal: true}
  edge:
