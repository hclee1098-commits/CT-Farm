name: ${COMPOSE_PROJECT_NAME:?SETUP으로_고유_프로젝트_ID를_생성하세요}
# filepath: compose.yaml - PostgreSQL과 Redis 로컬 개발 환경 구성
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?데이터베이스_사용자_필수}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?데이터베이스_비밀번호_필수}
      POSTGRES_DB: ${POSTGRES_DB:?데이터베이스_이름_필수}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

